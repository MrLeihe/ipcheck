[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-ipcheck"
version = "0.2.2"
description = "Evidence-based Claude AI IP risk, proxy, DNS and timezone diagnostics"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []
keywords = ["claude", "anthropic", "ip", "proxy", "dns", "timezone", "diagnostics", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Networking",
]

[project.urls]
Homepage = "https://github.com/MrLeihe/ipcheck"
Repository = "https://github.com/MrLeihe/ipcheck"
Issues = "https://github.com/MrLeihe/ipcheck/issues"

[project.scripts]
ipcheck = "ipcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ipcheck = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
