[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ipcheck-local"
version = "0.2.0"
description = "Evidence-based Claude AI IP risk, proxy, DNS and timezone diagnostics"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
ipcheck = "ipcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ipcheck = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
